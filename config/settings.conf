# xray-router settings. This file is sourced by BusyBox ash; keep shell syntax.

# Space-separated OpenWrt bridge/device names whose forwarded traffic is managed.
LAN_INTERFACES="br-lan"

# These two ports must match the tproxy-in and dns-in ports in config.json.
TPROXY_PORT="12345"
XRAY_DNS_PORT="1053"

# TProxy policy-routing values. Change them if another proxy already owns them.
TPROXY_MARK="0x1"
OUTBOUND_MARK="0x2"
ROUTE_TABLE="100"
RULE_PRIORITY="10010"

# Xray geosite.dat and geoip.dat directory.
XRAY_ASSET_DIR="/usr/share/xray"

# 1: known CN IPv4 destinations bypass Xray in the kernel fast path.
# 0: send them through Xray too, allowing force-proxy domain rules to override.
ENABLE_CN_FASTPATH="1"

# This release transparently proxies IPv4 only.
# block: allow local/link-local IPv6, reject global IPv6 to avoid proxy bypass.
# bypass: leave every IPv6 packet untouched (only safe if bypass is intentional).
IPV6_MODE="block"

# xrayctl start/stop will apply/restore dnsmasq settings when this is 1.
MANAGE_DNSMASQ="1"
DNSMASQ_CACHE_SIZE="1000"

# The shipped proxy-main is a blackhole placeholder. Keep this at 0 so start
# refuses until you replace that outbound. Set to 1 only for deliberate testing.
ALLOW_BLACKHOLE_PROXY="0"

# APNIC delegated statistics are converted locally into CN IPv4 CIDRs.
CN_LIST_URL="https://ftp.apnic.net/stats/apnic/delegated-apnic-latest"

# Optional download proxy for update-cn only; requires curl when set.
# Examples: http://192.168.1.1:10809 or socks5h://192.168.1.1:10808.
# Leave empty for normal direct Internet access. A local Xray proxy must be running.
CN_DOWNLOAD_PROXY=""
